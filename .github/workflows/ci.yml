name: CI

on:
    push:
        branches: [v5.x]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: Pint and Larastan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-lint-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-lint-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Check code style
              run: vendor/bin/pint --test

            - name: Run static analysis
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

    tests:
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-

            - name: Install dependencies
              run: |
                  composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

            - name: Show installed versions
              run: |
                  for package in laravel/framework orchestra/testbench phpunit/phpunit; do
                      composer show "$package" | grep -E '^(name|versions)'
                  done

            - name: Run tests
              run: vendor/bin/phpunit

    conformance:
        name: Protocol conformance
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-conformance-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-conformance-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            # The schemas in tests/protocol and the conformance kit come from the same commit
            - name: Read the protocol version
              id: protocol
              run: echo "ref=$(cat tests/protocol/VERSION)" >> "$GITHUB_OUTPUT"

            - name: Check out @panneau/protocol
              uses: actions/checkout@v5
              with:
                  repository: folkloreinc/panneau-js
                  ref: ${{ steps.protocol.outputs.ref }}
                  path: build/panneau-js
                  sparse-checkout: packages/protocol

            - uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Bundle the conformance kit
              run: tests/conformance/build.sh build/panneau-js build/conformance.mjs

            - name: Build and serve the fixture app
              run: |
                  vendor/bin/testbench workbench:build
                  vendor/bin/testbench serve --port=8000 > build/serve.log 2>&1 &
                  for attempt in $(seq 1 30); do
                      curl --silent --output /dev/null http://127.0.0.1:8000/panneau/api/definition && exit 0
                      sleep 1
                  done
                  echo "The app did not start." && exit 1

            - name: Run the conformance kit
              run: node tests/conformance/run.mjs build/conformance.mjs http://127.0.0.1:8000/panneau/api

            - name: Show the server log
              if: failure()
              run: cat build/serve.log
