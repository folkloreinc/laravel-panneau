name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
            - run: npm ci
            - run: composer install
            - run: composer global require laravel/envoy
            - run: ~/.composer/vendor/bin/envoy run deploy
